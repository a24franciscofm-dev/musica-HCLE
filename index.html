<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Educativo - Clube IES San Clemente</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }

        header h1 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        header p {
            color: #64748b;
        }

        .global-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-play { background-color: var(--success); color: white; }
        .btn-play:hover { background-color: #059669; }
        
        .btn-pause { background-color: #e2e8f0; color: var(--text); }
        .btn-pause:hover { background-color: #cbd5e1; }

        .btn-reset { background-color: #64748b; color: white; }
        .btn-reset:hover { background-color: #475569; }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .instruments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .instrument-card {
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
            background: var(--card-bg);
        }

        .instrument-card.playing {
            border-color: var(--primary-light);
            background-color: #eff6ff;
        }

        .instrument-card.muted {
            opacity: 0.6;
        }

        .instrument-img {
            width: 100%;
            height: 120px;
            background-color: #e2e8f0;
            border-radius: 6px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .instrument-name {
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .btn-mute {
            width: 100%;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-mute.active {
            background-color: var(--success);
            color: white;
            border-color: var(--success);
        }

        .btn-mute.muted {
            background-color: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .status-bar {
            text-align: center;
            font-weight: 600;
            color: #64748b;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Aplicações para o Ensino da Música</h1>
        <p>Identifica os instrumentos ativando e desativando as faixas de áudio sincronizadas.</p>
    </header>

    <!-- Elementos de Audio Ocultos (Nomes atualizados) -->
    <audio id="audio-0" src="faixa1.wav" preload="auto" loop></audio>
    <audio id="audio-1" src="faixa2.wav" preload="auto" loop></audio>
    <audio id="audio-2" src="faixa3.wav" preload="auto" loop></audio>
    <audio id="audio-3" src="faixa4.wav" preload="auto" loop></audio>

    <!-- Controlo Geral -->
    <div class="global-controls">
        <button id="playBtn" class="btn btn-play">▶ Reproduzir</button>
        <button id="pauseBtn" class="btn btn-pause" disabled>⏸ Pausa</button>
        <button id="resetBtn" class="btn btn-reset">🔄 Reiniciar</button>
    </div>

    <!-- Grelha de Instrumentos -->
    <div class="instruments-grid">
        <!-- Faixa 1 -->
        <div class="instrument-card" id="card-0">
            <div class="instrument-img">🎹</div>
            <div class="instrument-name">Instrumento 1 (Melodia)</div>
            <button class="btn-mute active" onclick="toggleMute(0)" id="mute-0">Som Ativo</button>
        </div>

        <!-- Faixa 2 -->
        <div class="instrument-card" id="card-1">
            <div class="instrument-img">🎸</div>
            <div class="instrument-name">Instrumento 2 (Harmonia)</div>
            <button class="btn-mute active" onclick="toggleMute(1)" id="mute-1">Som Ativo</button>
        </div>

        <!-- Faixa 3 -->
        <div class="instrument-card" id="card-2">
            <div class="instrument-img">🎻</div>
            <div class="instrument-name">Instrumento 3 (Baixo)</div>
            <button class="btn-mute active" onclick="toggleMute(2)" id="mute-2">Som Ativo</button>
        </div>

        <!-- Faixa 4 -->
        <div class="instrument-card" id="card-3">
            <div class="instrument-img">🥁</div>
            <div class="instrument-name">Instrumento 4 (Ritmo)</div>
            <button class="btn-mute active" onclick="toggleMute(3)" id="mute-3">Som Ativo</button>
        </div>
    </div>

    <div class="status-bar" id="statusText">Estado: Parado</div>
</div>

<script>
    let isPlaying = false;

    const tracks = [
        { id: 0, audio: document.getElementById('audio-0'), muted: false },
        { id: 1, audio: document.getElementById('audio-1'), muted: false },
        { id: 2, audio: document.getElementById('audio-2'), muted: false },
        { id: 3, audio: document.getElementById('audio-3'), muted: false }
    ];

    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusText = document.getElementById('statusText');

    function playAll() {
        if (!isPlaying) {
            tracks.forEach(track => {
                track.audio.play().catch(error => {
                    console.log("Erro de reprodução:", error);
                });
                
                const card = document.getElementById(`card-${track.id}`);
                if (!track.muted) card.classList.add('playing');
            });

            isPlaying = true;
            statusText.innerText = "Estado: A reproduzir simultaneamente";
            playBtn.disabled = true;
            pauseBtn.disabled = false;
        }
    }

    function pauseAll() {
        if (isPlaying) {
            tracks.forEach(track => {
                track.audio.pause();
                document.getElementById(`card-${track.id}`).classList.remove('playing');
            });
            isPlaying = false;
            statusText.innerText = "Estado: Em pausa";
            playBtn.disabled = false;
            pauseBtn.disabled = true;
        }
    }

    function resetAll() {
        tracks.forEach(track => {
            track.audio.pause();
            track.audio.currentTime = 0;
            document.getElementById(`card-${track.id}`).classList.remove('playing');
        });
        isPlaying = false;
        statusText.innerText = "Estado: Reiniciado e pronto";
        playBtn.disabled = false;
        pauseBtn.disabled = true;
    }

    function toggleMute(trackId) {
        const track = tracks.find(t => t.id === trackId);
        const btn = document.getElementById(`mute-${track.id}`);
        const card = document.getElementById(`card-${track.id}`);

        track.muted = !track.muted;
        track.audio.muted = track.muted;

        if (track.muted) {
            btn.innerText = "Som Desativado";
            btn.className = "btn-mute muted";
            card.classList.remove('playing');
            card.classList.add('muted');
        } else {
            btn.innerText = "Som Ativo";
            btn.className = "btn-mute active";
            card.classList.remove('muted');
            if (isPlaying) card.classList.add('playing');
        }
    }

    playBtn.addEventListener('click', playAll);
    pauseBtn.addEventListener('click', pauseAll);
    resetBtn.addEventListener('click', resetAll);
</script>

</body>
</html>
